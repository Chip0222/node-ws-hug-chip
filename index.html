<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Social Profiles</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* 基础重置与科技感背景 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #090e17 0%, #121c2d 100%);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 主容器：玻璃拟物化科技感 */
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 
                        inset 0 0 20px rgba(0, 255, 255, 0.02);
            text-align: center;
        }

        /* 顶部标题栏 */
        .profile-title {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        /* 链接列表单列排版 */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 单个链接按钮样式 */
        .link-item {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.6);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* 图标样式 */
        .link-item i {
            font-size: 22px;
            width: 30px;
            text-align: center;
            margin-right: 15px;
            transition: all 0.3s ease;
        }

        /* 文本样式 */
        .link-item span {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* 鼠标悬停时的科技发光交互效果 */
        .link-item:hover {
            transform: translateY(-3px);
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(0, 242, 254, 0.5);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.2);
            color: #ffffff;
        }

        .link-item:hover i {
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
        }

        /* 左侧科技感渐变竖条 */
        .link-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: linear-gradient(to bottom, #00f2fe, #4facfe);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .link-item:hover::before {
            opacity: 1;
        }

        /* 为不同的平台设置悬停时的品牌色发光 */
        .link-item.github:hover i { color: #ffffff; text-shadow: 0 0 10px #ffffff; }
        .link-item.github:hover::before { background: #ffffff; }
        .link-item.github:hover { border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 5px 15px rgba(255,255,255,0.1); }
        
        .link-item.x:hover i { color: #ffffff; text-shadow: 0 0 10px #ffffff; }
        .link-item.x:hover::before { background: #ffffff; }
        .link-item.x:hover { border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 5px 15px rgba(255,255,255,0.1); }

        .link-item.youtube:hover i { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
        .link-item.youtube:hover::before { background: #ff0000; }
        .link-item.youtube:hover { border-color: rgba(255, 0, 0, 0.4); box-shadow: 0 5px 15px rgba(255,0,0,0.1); }
        
        .link-item.reddit:hover i { color: #ff4500; text-shadow: 0 0 10px #ff4500; }
        .link-item.reddit:hover::before { background: #ff4500; }
        .link-item.reddit:hover { border-color: rgba(255, 69, 0, 0.4); box-shadow: 0 5px 15px rgba(255,69,0,0.1); }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="profile-title">Connect With Me</h1>
        
        <div class="link-list">
            <a href="https://github.com/Chip0222" target="_blank" class="link-item github">
                <i class="fab fa-github"></i>
                <span>GitHub</span>
            </a>

            <a href="https://x.com/ch1p_0222" target="_blank" class="link-item x">
                <i class="fa-brands fa-x-twitter"></i>
                <span>X</span>
            </a>

            <a href="https://www.facebook.com/profile.php?id=61585810324278" target="_blank" class="link-item facebook">
                <i class="fab fa-facebook-f"></i>
                <span>Facebook</span>
            </a>

            <a href="https://www.instagram.com/ch1p_0222" target="_blank" class="link-item instagram">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>

            <a href="https://www.youtube.com/@chip_0222" target="_blank" class="link-item youtube">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
            </a>

            <a href="https://www.tiktok.com/@ch1p_0222" target="_blank" class="link-item tiktok">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </a>

            <a href="https://www.reddit.com/user/chip_0222" target="_blank" class="link-item reddit">
                <i class="fab fa-reddit-alien"></i>
                <span>Reddit</span>
            </a>
        </div>
    </div>

</body>
</html>
